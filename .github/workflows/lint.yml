# Style check. A help, not a grade: nothing here affects your mark.
# Run the same check locally with `uv run ruff check .`

name: Style (ruff)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff lint
        run: uvx ruff@0.15.22 check . --output-format=github
