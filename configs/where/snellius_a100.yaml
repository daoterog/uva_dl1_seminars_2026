# Where: a full A100 40 GB on Snellius (partition gpu_a100, 18 cores per GPU). Picked by
# `--where snellius_a100`, or automatically inside a gpu_a100 job. Every hour bills a GPU
# share whether the GPU is busy or not. A small model on CIFAR-10 rarely fills an A100:
# prefer gpu_mig unless you can fill it.
data:
  # Shared scratch: fast, and not counted against your small home quota. Created if missing.
  root: /scratch-shared/${oc.env:USER}/data
  # 18 cores per GPU share: 17 workers leave exactly one for the main process.
  num_workers: 17
  batch_size: 256
train:
  precision: bf16-mixed
logging:
  # Home is small: the wandb run files and the checkpoints go to shared scratch. (Not $TMPDIR,
  # which is wiped when the job ends.)
  save_dir: /scratch-shared/${oc.env:USER}/outputs
