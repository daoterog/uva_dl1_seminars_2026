# What is trained: data, model, optimisation. The same settings as the `cfg` cell of
# notebooks/prototyping.ipynb, plus the ones the tooling adds (Trainer and wandb).
#
# Machine-dependent settings (workers, precision, where wandb writes) belong to
# configs/where/, so that a cluster run never silently inherits a laptop value. See
# src/config.py for the merge order.
seed: 0

data:
  root: data/
  val_size: 5000
  batch_size: 128
  num_workers: 4
  augment: true
  # --- For later: options this project does not use (yet). Not read by the code. ----------
  # eval_batch_size: 512       # no activations kept for backward: evaluation fits bigger batches
  # eval_num_workers: 2        # evaluation runs rarely; fewer workers sitting idle in memory
  # pin_memory: true           # page-locked host memory: faster copies to the GPU
  # prefetch_factor: 2         # batches each worker keeps ready, all held in host RAM
  # drop_last: true            # a short last batch is a new shape (torch.compile recompiles)

model:
  # small_cnn: the CNN from notebooks/prototyping.ipynb, ~1.2M parameters at width 64.
  # resnet18:  CIFAR-style ResNet-18 (3x3 stem, no max-pool), ~11M parameters.
  # mlp:       a small MLP.
  name: small_cnn
  num_classes: 10
  # small_cnn: channels of the first block (doubled by each block after it).
  width: 64
  # mlp: sizes of the hidden layers.
  mlp_hidden: [512, 512]

optim:
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  # --- For later: options this project does not use (yet). Not read by the code. ----------
  # nesterov: true             # Nesterov momentum (hard-coded on, as in the notebook)
  # label_smoothing: 0.1       # soften the one-hot targets: a regulariser

# The Lightning Trainer's arguments.
train:
  max_epochs: 10
  # 32-true | bf16-mixed (NVIDIA Ampere or newer: RTX 30xx, A100, H100) | 16-mixed.
  # Set per machine in configs/where/.
  precision: 32-true
  # null: no clipping.
  gradient_clip_val: null
  # One optimiser step every N batches.
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  # true: one batch of train, val and test, to catch bugs before a long run.
  fast_dev_run: false
  # null | simple | advanced | pytorch. `simple` prints the time per Lightning hook at the
  # end. Profilers slow the run: use them on a short one.
  profiler: null
  # --- For later: options this project does not use (yet). Not read by the code. ----------
  # compile: true              # torch.compile: fused kernels, after a warm-up of tens of seconds
  # compile_mode: default      # default | reduce-overhead (CUDA graphs) | max-autotune
  # matmul_precision: high     # TF32 for the matmuls autocast leaves in fp32
  # cudnn_benchmark: true      # cuDNN tries each convolution algorithm once, keeps the fastest
  # deterministic: true        # bit-identical reruns, at some cost in speed

# The WandbLogger's arguments, and how often to log.
logging:
  # null: your own wandb user. Set it to a team to share runs.
  entity: null
  project: dl1-seminars
  # null: wandb picks a name.
  name: null
  # Runs that belong together, e.g. one sweep.
  group: null
  tags: []
  # true: write locally, upload later with `wandb sync`. Compute nodes have no internet.
  offline: false
  # Where wandb writes the run, and Lightning its checkpoints (one directory per run).
  save_dir: outputs/
  log_every_n_steps: 50
  # --- For later: options this project does not use (yet). Not read by the code. ----------
  # progress_every: 50         # progress-bar refresh: each one waits for the GPU (a sync)
