# What is trained: data, model, optimisation. Machine-dependent settings (workers,
# precision, compile, batch size for a given GPU) belong to configs/where/, and are
# set there rather than here, so that a cluster run never silently inherits a laptop
# value. See src/config.py for the merge order.
seed: 0

data:
  root: data/
  val_size: 5000
  batch_size: 128
  # null follows batch_size. Evaluation keeps no activations for backward, so it can
  # usually run at several times the training batch.
  eval_batch_size: null
  augment: true
  num_workers: 4
  eval_num_workers: 2
  pin_memory: true
  # A short last batch is a new input shape, and a compiled model recompiles for it.
  drop_last: true

model:
  # resnet18: CIFAR-style ResNet-18 (3x3 stem, no max-pool), ~11M parameters.
  # mlp:      a small MLP, too little work per step to keep any GPU busy.
  name: resnet18
  num_classes: 10
  mlp_hidden: [512, 512]

optim:
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  nesterov: true
  label_smoothing: 0.0

train:
  max_epochs: 30
  check_val_every_n_epoch: 1
  # Set per machine in configs/where/.
  precision: 32-true
  matmul_precision: highest
  compile: false
  # default | reduce-overhead (CUDA graphs) | max-autotune
  compile_mode: default
  cudnn_benchmark: false
  deterministic: false
  # null | simple | advanced | pytorch. `simple` prints time per Lightning hook at the end.
  # Profilers slow the run: use them on a short one.
  profiler: null

logging:
  project: dl1-seminars
  # online | offline | disabled. Compute nodes have no internet: use offline there and
  # `wandb sync` the run directory from a login node afterwards.
  wandb_mode: online
  # null: wandb's default, ./wandb. On Snellius point it at scratch: home quota is small.
  wandb_dir: null
  group: null
  tags: []
  log_every_n_steps: 50
  # Each progress-bar refresh turns the prog_bar metrics into Python numbers, which waits
  # for the GPU to finish. Refreshing every step means a sync every step.
  progress_every: 50
  checkpoint_dir: checkpoints/
