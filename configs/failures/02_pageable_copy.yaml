# Card 2: the host-to-device copy is synchronous and sits on the step's critical path.
# Reproduces: pageable (unpinned) host memory, with batches big enough for the copy to
# matter next to a cheap model. With ResNet-18 at batch 128 (~1.5 MB per batch) you will
# not see it; that is the lesson as much as the fix.
# Fix: `data.pin_memory=true`; for big batches also overlap the copy (dl1/prefetch.py).
data:
  pipeline: classic
  pin_memory: false
  batch_size: 2048
model:
  name: mlp
